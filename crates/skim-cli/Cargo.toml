[package]
name = "skim-cli"
description = "skim command line: M0 probes, later run/status/watch/call/bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "skim"
path = "src/main.rs"

[dependencies]
skim-bal.workspace = true
skim-el.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-rlp.workspace = true
redb.workspace = true
zstd = "0.13.3"
thiserror.workspace = true
alloy-trie.workspace = true
reth-eth-wire-types.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
revm.workspace = true
reqwest.workspace = true
skim-snap.workspace = true
skim-state.workspace = true
skim-sim.workspace = true
axum.workspace = true
metrics = "0.24"
metrics-exporter-prometheus = { version = "=0.18.3", default-features = false }
metrics-process = "=2.4.3"
metrics-util = { version = "0.20", default-features = false }
serde_yaml_ng.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-rpc-types-trace.workspace = true
skim-cl.workspace = true
skim-chain.workspace = true
dhat = { version = "=0.3.3", optional = true }


[features]
# Heap profiling build: replaces the allocator with dhat's (slow; diagnostics only).
dhat-heap = ["dep:dhat"]

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { version = "=0.1.52", default-features = false }
libc = "0.2.190"

[dev-dependencies]
skim-chain = { workspace = true, features = ["testkit"] }
tempfile = "3"
skim-cl = { workspace = true, features = ["testkit"] }
