<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skim</title>
<style>
:root { --bg:#f6f6f3; --panel:#fff; --ink:#1c1d1f; --muted:#6b6e74; --line:#e3e3de; --ok:#1f7a4d; --bad:#b4372b; --warn:#a86a00; --accent:#2d5bd7; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#121314; --panel:#1b1c1e; --ink:#e8e8e6; --muted:#9a9ca1; --line:#2c2d30; --ok:#4cc38a; --bad:#ff7a6b; --warn:#e2a93b; --accent:#7ea2ff; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width:1100px; margin:0 auto; padding:20px 16px 40px; }
header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
h1 { font-size:20px; margin:0; letter-spacing:-.01em; }
h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; font-weight:600; }
.sub { color:var(--muted); font-size:13px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin-bottom:16px; }
.stat, section { background:var(--panel); border:1px solid var(--line); border-radius:10px; }
.stat { padding:12px 14px; }
.stat .k { color:var(--muted); font-size:12px; }
.stat .v { font-size:22px; font-variant-numeric:tabular-nums; margin-top:2px; }
section { padding:14px; margin-bottom:16px; }
.wrap { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
th, td { text-align:left; padding:6px 10px 6px 0; border-bottom:1px solid var(--line); white-space:nowrap; font-size:13px; }
th { color:var(--muted); font-weight:500; font-size:12px; }
td.num, th.num { text-align:right; }
.ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
code, .mono { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
.bars { display:flex; align-items:flex-end; gap:2px; height:64px; }
.bars span { flex:1; background:var(--accent); opacity:.75; border-radius:2px 2px 0 0; min-height:1px; }
.bars span.miss { background:var(--bad); }
.missing { color:var(--muted); font-size:12px; white-space:normal; }
#err { color:var(--bad); }
</style>
</head>
<body>
<main>
  <header>
    <h1>skim <span class="sub" id="net">Sepolia</span></h1>
    <div class="sub">read-only · refreshes every 5 s · <span id="updated">loading…</span> <span id="err"></span></div>
  </header>
  <div class="grid" id="summary"></div>
  <section><h2>Subscriptions</h2><div class="wrap" id="subs"></div></section>
  <section><h2>Block arrival (ms after slot start, newest right)</h2><div class="bars" id="bars"></div><div class="sub" id="barsnote"></div></section>
  <section><h2>RPC latency</h2><div class="wrap" id="rpc"></div></section>
  <section><h2>Execution peers</h2><div class="wrap" id="el"></div></section>
  <section><h2>Consensus peers</h2><div class="wrap" id="cl"></div></section>
  <section><h2>Addresses calls read</h2><div class="wrap" id="addrs"></div></section>
</main>
<script>
const esc = (x) => String(x ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const num = (x, d = 0) => (x === null || x === undefined || Number.isNaN(Number(x))) ? "–" : Number(x).toLocaleString(undefined, { maximumFractionDigits: d });
function table(cols, rows) {
  if (!rows.length) return '<div class="sub">none</div>';
  const head = cols.map((c) => `<th class="${c.num ? "num" : ""}">${esc(c.h)}</th>`).join("");
  const body = rows.map((r) => "<tr>" + cols.map((c) => `<td class="${c.num ? "num" : ""}">${c.html ? c.f(r) : esc(c.f(r))}</td>`).join("") + "</tr>").join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}
function stat(k, v, cls = "") { return `<div class="stat"><div class="k">${esc(k)}</div><div class="v ${cls}">${v}</div></div>`; }

function render(doc) {
  const st = doc.status || {}, d = doc.dashboard || {}, s = d.summary || {};
  const lc = st.light_client || {};
  const age = s.head_age_s;
  const fin = lc.finalized_block?.number ?? lc.finalized_block;
  document.getElementById("summary").innerHTML = [
    stat("Head", num(s.head ?? st.head)),
    stat("Head age", age == null ? "–" : `${num(age, 1)} s`, age == null ? "" : age > 36 ? "bad" : age > 18 ? "warn" : "ok"),
    stat("Finalized (verified)", num(typeof fin === "object" ? null : fin)),
    stat("EL peers / SNAP", `${num(s.el_peers)} / ${num(s.snap_peers)}`),
    stat("CL peers", num(s.cl_peers)),
    stat("Subscribed keys", num(s.subscribed_keys)),
    stat("On-demand keys", num(s.on_demand_keys)),
    stat("History", esc(st.history?.mode ?? "–")),
    stat("Uptime", `${num(s.uptime_min)} min`),
  ].join("");

  const subs = Array.isArray(doc.subscriptions) ? doc.subscriptions : [];
  document.getElementById("subs").innerHTML = table([
    { h: "Name", f: (r) => r.name },
    { h: "Ready", html: true, f: (r) => r.ready ? '<span class="ok">ready</span>' : '<span class="bad">not ready</span>' },
    { h: "Block", num: true, f: (r) => num(r.block) },
    { h: "Keys", num: true, f: (r) => num(r.required_keys) },
    { h: "Missing", num: true, f: (r) => num(r.missing_keys) },
    { h: "Waiting for", html: true, f: (r) => `<span class="missing mono">${esc((r.missing || []).join(", "))}</span>${r.truncated ? ' <span class="warn">truncated by the key limit</span>' : ""}${r.error ? ` <span class="bad">${esc(r.error)}</span>` : ""}` },
  ], subs);

  const b = d.blocks || {}, arr = b.arrival_ms || [], nums = b.numbers || [];
  const finite = arr.filter((x) => x != null);
  const max = Math.max(4000, ...finite);
  document.getElementById("bars").innerHTML = arr.map((x, i) => x == null
    ? `<span class="miss" style="height:100%" title="block ${esc(nums[i])}: missed"></span>`
    : `<span style="height:${Math.max(2, (x / max) * 100)}%" title="block ${esc(nums[i])}: ${num(x)} ms"></span>`).join("");
  const sorted = [...finite].sort((a, c) => a - c);
  document.getElementById("barsnote").textContent = sorted.length ? `median ${num(sorted[Math.floor(sorted.length / 2)])} ms over the last ${sorted.length} blocks` : "";

  document.getElementById("rpc").innerHTML = table([
    { h: "Method", f: (r) => r.method },
    { h: "Calls", num: true, f: (r) => num(r.count) },
    { h: "Errors", num: true, f: (r) => num(r.errors) },
    { h: "p50 ms", num: true, f: (r) => num(r.p50_ms, 1) },
    { h: "p95 ms", num: true, f: (r) => num(r.p95_ms, 1) },
    { h: "max ms", num: true, f: (r) => num(r.max_ms, 1) },
  ], d.rpc || []);

  document.getElementById("el").innerHTML = table([
    { h: "Client", f: (r) => `${r.client} ${r.version || ""}` },
    { h: "Protocols", f: (r) => `${r.eth} · ${r.snap}` },
    { h: "Connected", num: true, f: (r) => `${num(r.age_min, 1)} min` },
    { h: "SNAP ok", num: true, f: (r) => num(r.snap_ok) },
    { h: "SNAP errors", num: true, f: (r) => num(r.snap_errors) },
    { h: "Latency (ewma)", num: true, f: (r) => r.ewma_ms == null ? "–" : `${num(r.ewma_ms)} ms` },
  ], d.el?.peers || []);

  document.getElementById("cl").innerHTML = table([
    { h: "Client", f: (r) => `${r.client} ${r.version || ""}` },
    { h: "Direction", f: (r) => r.direction },
    { h: "Connected", num: true, f: (r) => `${num(r.age_min, 1)} min` },
    { h: "Head slot", num: true, f: (r) => num(r.head_slot) },
  ], d.cl?.peers || []);

  document.getElementById("addrs").innerHTML = table([
    { h: "Address", html: true, f: (r) => `<span class="mono">${esc(r.address)}</span>${r.label ? ` <span class="sub">${esc(r.label)}</span>` : ""}` },
    { h: "Status", f: (r) => r.status },
    { h: "Calls", num: true, f: (r) => num(r.calls) },
    { h: "Slots", num: true, f: (r) => num(r.slots) },
    { h: "Unpinned slots", num: true, f: (r) => num(r.unpinned_slots) },
    { h: "Fetched", num: true, f: (r) => num(r.fetched) },
  ], (d.addresses || []).slice(0, 50));

  document.getElementById("updated").textContent = "updated " + new Date().toLocaleTimeString();
  document.getElementById("err").textContent = "";
}

async function tick() {
  try {
    const r = await fetch("dashboard.json", { cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    render(await r.json());
  } catch (e) {
    document.getElementById("err").textContent = `· can't reach skim (${e.message})`;
  }
}
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
