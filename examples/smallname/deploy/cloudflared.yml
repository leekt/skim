# A Cloudflare tunnel in front of smallname and skim's Grafana. skim's RPC stays on 127.0.0.1.
# Grafana: the repo's metrics/ stack, with Prometheus and Grafana on loopback (see the README).
#   cloudflared tunnel login              # authorize the zone (prints a URL)
#   cloudflared tunnel create smallname   # or: npx wrangler tunnel create smallname
#   cloudflared tunnel route dns smallname <hostname>
#   cloudflared tunnel route dns smallname <grafana-hostname>
tunnel: <tunnel-id>
credentials-file: /home/skim/.cloudflared/<tunnel-id>.json
ingress:
  - hostname: <hostname>
    path: ^/(v1/.*|healthz|index\.html)?$
    service: http://127.0.0.1:8787
  - hostname: <grafana-hostname>
    service: http://127.0.0.1:3001
  - service: http_status:404
