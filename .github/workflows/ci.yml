name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Every regression found in reviews lives in the test suite; it gates every change.
    name: Tests (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8 (commit)
      - name: Test
        run: cargo test --workspace --profile ci --locked
      - name: Clippy
        # Warning-free since 2026-10-31: keep it that way.
        run: cargo clippy --workspace --all-targets --profile ci --locked -- -D warnings
      - name: EVM2 experiment builds and is lint-clean
        # Opt-in (`--features evm2`), so the default test run never compiles it.
        run: cargo clippy -p skim-sim -p skim-cli --features skim-cli/evm2 --all-targets --profile ci --locked -- -D warnings

  smallname:
    # examples/smallname's own tests (no network): the stream consumer's transactions.
    name: smallname tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Install
        working-directory: examples
        run: npm ci --no-audit --no-fund
      - name: Test
        working-directory: examples
        run: npm run smallname-test
      - name: wallet example tests
        working-directory: examples
        run: npm run wallet-test

  fuzz-regressions:
    # Replays inputs that once crashed a parser (no new fuzzing).
    name: Fuzz regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8 (commit)
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build every target
        # Replaying builds only the targets that have regression inputs; a target without any
        # (light_client) once stopped compiling unnoticed.
        working-directory: fuzz
        run: cargo +nightly fuzz build -O
      - name: Replay
        working-directory: fuzz
        run: |
          for dir in regressions/*/; do
            target=$(basename "$dir")
            echo "== $target"
            cargo +nightly fuzz run -O "$target" "$dir"* -- -runs=0
          done
