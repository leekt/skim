name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Every regression found in reviews lives in the test suite; it gates every change.
    name: Tests (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
      - name: Test
        run: cargo test --workspace --profile ci --locked
      - name: Clippy (report only)
        run: cargo clippy --workspace --profile ci --locked
        continue-on-error: true

  smallname:
    # examples/smallname's own tests (no network): the stream consumer's transactions.
    name: smallname tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Install
        working-directory: examples
        run: npm ci --no-audit --no-fund
      - name: Test
        working-directory: examples
        run: npm run smallname-test

  fuzz-regressions:
    # Replays inputs that once crashed a parser (no new fuzzing).
    name: Fuzz regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Replay
        working-directory: fuzz
        run: |
          for dir in regressions/*/; do
            target=$(basename "$dir")
            echo "== $target"
            cargo +nightly fuzz run -O "$target" "$dir"* -- -runs=0
          done
