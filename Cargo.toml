[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Pinned to the versions reth v2.7.0 uses, so one alloy/revm graph is shared with reth crates.
alloy-primitives = { version = "1.6.1", features = ["serde"] }
alloy-rlp = "0.3.16"
alloy-eip7928 = { version = "0.4.10", features = ["rlp"] }
alloy-consensus = "2.5.0"
alloy-trie = "0.9.8"

reth-network = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-eth-wire = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-network-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-eth-wire-types = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-network-peers = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-storage-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-tasks = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-dns-discovery = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }

tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
redb = "=4.3.0"
parking_lot = "0.12"
revm = { version = "43.0.3", default-features = false, features = ["std", "dev", "optional_fee_charge", "secp256k1", "blst", "c-kzg", "asm-keccak"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "ws"] }
alloy-rpc-types-eth = { version = "2.5.0", features = ["serde"] }
alloy-rpc-types-trace = "=2.5.0"
revm-inspectors = "=0.44.1"

skim-bal = { path = "crates/skim-bal" }
skim-el = { path = "crates/skim-el" }
skim-snap = { path = "crates/skim-snap" }
skim-state = { path = "crates/skim-state" }
skim-sim = { path = "crates/skim-sim" }
skim-cl = { path = "crates/skim-cl" }

[profile.release]
# Full LTO: +24-28% eth_call throughput over thin LTO (M7), at a slower clean build.
lto = "fat"
codegen-units = 1

# CI's test builds: optimized, but quicker to build than a release.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
